[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-agent-backend"
version = "0.1.0"
description = "Modern web-scraping news aggregation app - Backend"
requires-python = ">=3.11"
authors = [{name = "News Agent Team"}]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "starlette==0.27.0",
    "httpx==0.24.1",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "alembic==1.12.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "argon2-cffi==21.3.0",
    "python-multipart==0.0.6",
    "celery==5.3.4",
    "redis==5.0.1",
    "requests==2.31.0",
    "openai>=1.12.0",
    "groq==0.10.0",
    "google-cloud-texttospeech==2.16.0",
    "aiohttp==3.9.1",
    "beautifulsoup4==4.12.2",
    "feedparser==6.0.10",
    "email-validator==2.0.0",
    "croniter==2.0.1",
    "python-dotenv==1.0.0",
    "tenacity==8.2.3",
    "sendgrid==6.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "argon2-cffi==21.3.0",
    "sendgrid==6.12.5",
    "starlette==0.27.0",
    "httpx==0.24.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
