name: Capture Deployment Logs

on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types: [completed]

jobs:
  capture-logs:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Install CLIs
        run: |
          npm install -g @railway/cli vercel

      - name: Fetch Railway Logs
        run: |
          railway logs --latest --lines 200 --json > railway-logs.json 2>&1
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        continue-on-error: true

      - name: Fetch Vercel Logs
        run: |
          vercel logs --json --limit 200 > vercel-logs.json 2>&1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

      - name: Upload Logs as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-logs-${{ github.run_number }}
          path: |
            railway-logs.json
            vercel-logs.json
          retention-days: 30
